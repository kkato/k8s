## Vault custom values

# Agent Injector は無効。シークレット配布は External Secrets Operator 経由で行う。
injector:
  enabled: false

server:
  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

  # 各 Pod に openebs-hostpath PVC を割り当て（StatefulSet volumeClaimTemplate）
  dataStorage:
    enabled: true
    storageClass: openebs-hostpath
    size: 2Gi

  # TLS はクラスタ内通信のみのため無効。外部は Cloudflare エッジで TLS 終端。
  dev:
    enabled: false

  # vault.kkato.app を Cloudflare Tunnel 経由で公開。TLS は Cloudflare エッジで終端。
  # 公開ゲートは Cloudflare Access(Zero Trust) で保護する。
  ingress:
    enabled: true
    ingressClassName: cloudflare-tunnel
    pathType: Prefix
    activeService: true
    hosts:
      - host: vault.kkato.app
        paths:
          - /
    tls: []

# UI は vault.kkato.app（Cloudflare Access 越し）で利用する。
ui:
  enabled: true
