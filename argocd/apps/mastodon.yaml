apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mastodon
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://mastodon.github.io/helm-charts
      chart: mastodon
      targetRevision: 1.1.3
      helm:
        valueFiles:
          - $values/apps/mastodon/values.yaml
    - repoURL: git@github.com:kkato/k8s
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mastodon
  # HPA が replicas を管理するため selfHeal が差分を戻さないよう除外する
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: mastodon-web
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: mastodon-streaming
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: mastodon-sidekiq-default
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
