apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radipod
  namespace: radipod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: radipod.kkato.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radipod
                port:
                  name: http
