apiVersion: v1
kind: ConfigMap
metadata:
  name: radipod-config
  namespace: radipod
data:
  config.json: |
    {
      "data_dir": "/app/data",
      "listen": "0.0.0.0:8080",
      "base_url": "https://radipod.kkato.app",
      "title": "安住紳一郎の日曜天国",
      "poll_interval": "30m",
      "lookback_days": 7,
      "record_timeout": "30m",
      "rules": [{ "station": "TBS", "match": "日曜天国" }]
    }
