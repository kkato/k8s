apiVersion: v1
kind: ConfigMap
metadata:
  name: radipod-config
  namespace: radipod
data:
  config.json: |
    {
      "data_dir": "/app/data",
      "listen": "0.0.0.0:8080",
      "base_url": "https://radipod.kkato.app",
      "title": "radipod｜日曜天国",
      "image_url": "https://raw.githubusercontent.com/kkato/radipod/1e35840231ee044a5b5c870f326811347879f863/assets/radipod-cover-v1.png",
      "poll_interval": "30m",
      "lookback_days": 7,
      "record_timeout": "30m",
      "rules": [{ "station": "TBS", "match": "日曜天国" }]
    }
