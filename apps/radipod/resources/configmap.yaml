apiVersion: v1
kind: ConfigMap
metadata:
  name: radipod-config
  namespace: radipod
data:
  config.json: |
    {
      "data_dir": "/app/data",
      "listen": "0.0.0.0:8080",
      "base_url": "https://radipod.kkato.app",
      "title": "radipod｜日曜天国",
      "image_url": "https://megaphone.imgix.net/podcasts/b15dd10e-dcc7-11ed-aff8-53dfe2b74109/image/07a248e9063822af458a022fc0f4d9a6.jpg?ixlib=rails-4.3.1&max-w=3000&max-h=3000&fit=crop&auto=format,compress",
      "poll_interval": "30m",
      "lookback_days": 7,
      "record_timeout": "30m",
      "rules": [{ "station": "TBS", "match": "日曜天国" }]
    }
