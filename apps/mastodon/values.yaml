# Mastodon Helm chart (mastodon/helm-charts 0.5.6) values
# ドメイン・シングルユーザー運用設定
mastodon:
  localDomain: social.kkato.app
  singleUserMode: true

  # Cloudflare R2 メディアストレージ (S3 互換)
  s3:
    enabled: true
    bucket: mastodon
    hostname: c0a9be02bb8b0f4a3a0461dc06777aeb.r2.cloudflarestorage.com
    endpoint: https://c0a9be02bb8b0f4a3a0461dc06777aeb.r2.cloudflarestorage.com
    region: auto
    aliasHost: media.social.kkato.app  # メディア公開配信用カスタムドメイン (S3_ALIAS_HOST)
    existingSecret: mastodon-s3  # keys: access-key-id, secret-access-key

  # アプリケーションシークレット (ExternalSecret で GCP Secret Manager から取得)
  secrets:
    existingSecret: mastodon-secrets  # keys: secret-key-base, vapid-private-key, vapid-public-key,
                                      #       are-primary-key, are-deterministic-key, are-derivation-salt

  # 初回デプロイ時に管理者アカウントを作成する
  # 生成されたパスワードは createAdmin Job のログで確認すること
  createAdmin:
    enabled: false
    username: kkato
    email: kkato149@gmail.com

  # SMTP: chart が username を必須とするためダミー値を設定（実際には送信しない）
  # 本格運用時は server/username/password を実際の値に差し替える
  smtp:
    server: localhost
    port: 25
    fromAddress: notifications@social.kkato.app
    username: notifications@social.kkato.app
    password: placeholder
    enableStartTls: never
    authMethod: none

  web:
    replicas: 3
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi  # cpu limit は設定しない(スロットリング回避)
    # 3ノードに1台ずつ配置する(特定ノードにメモリが偏るのを防ぐ)
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: mastodon
            app.kubernetes.io/instance: mastodon
            app.kubernetes.io/component: web

  streaming:
    replicas: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: mastodon
            app.kubernetes.io/instance: mastodon
            app.kubernetes.io/component: streaming

  sidekiq:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi  # cpu limit は設定しない(スロットリング回避)
    workers:
      - name: default
        replicas: 3
        concurrency: 5
        queues:
          - default
          - push
          - pull
          - mailers
          - ingress
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: mastodon
                app.kubernetes.io/instance: mastodon
                app.kubernetes.io/component: sidekiq-default
      - name: scheduler
        replicas: 1
        concurrency: 5
        queues:
          - scheduler

# Gateway API HTTPRoute はデフォルト有効なので明示的に無効化する
httproute:
  enabled: false

# Cloudflare Tunnel Ingress
ingress:
  enabled: true
  className: cloudflare-tunnel
  hosts:
    - host: social.kkato.app
      paths:
        - path: /
          pathType: Prefix
  tls: []  # TLS は Cloudflare 側で終端するため不要

# 外部 PostgreSQL (CNPG mastodon-db クラスタの RW サービス)
postgresql:
  hostname: mastodon-db-rw
  port: 5432
  database: mastodon_production
  username: mastodon
  existingSecret: mastodon-db
  existingSecretKeys:
    username: username
    password: password

# 全文検索: 自前 Elasticsearch 3ノードクラスタ (apps/mastodon/resources/elasticsearch.yaml)
elasticsearch:
  enabled: true
  hostname: mastodon-es
  port: 9200
  tls: false
  preset: small_cluster

# 自前 Redis (apps/mastodon/resources/redis.yaml)
redis:
  hostname: mastodon-redis
  port: 6379
  existingSecret: mastodon-redis-auth
  existingSecretKeys:
    password: redis-password
